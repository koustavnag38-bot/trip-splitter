name: Build TripTogether Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIPTOGETHER_URL: ${{ vars.TRIPTOGETHER_URL }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate deployed app URL
        run: |
          if [ -z "$TRIPTOGETHER_URL" ]; then
            echo "Add a GitHub Actions repository variable named TRIPTOGETHER_URL with your deployed HTTPS app URL."
            exit 1
          fi
          case "$TRIPTOGETHER_URL" in https://*) ;; *) echo "TRIPTOGETHER_URL must start with https://"; exit 1;; esac

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TripTogether-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
